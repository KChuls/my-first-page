<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KChuls의 첫 웹페이지</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2330;
      --muted: #5c6475;
      --accent: #2f6fed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161c;
        --card: #1e2129;
        --text: #eceef3;
        --muted: #a2a9b8;
        --accent: #6b9bff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .emoji { font-size: 48px; }
    h1 { margin: 12px 0 8px; font-size: 26px; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
    #time { font-size: 32px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
    button {
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 16px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    #count { margin-top: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">👋</div>
    <h1>안녕하세요, KChuls입니다!</h1>
    <p>Claude Code로 만들고 GitHub에 올린<br>저의 첫 번째 웹페이지예요.</p>
    <div id="time">--:--:--</div>
    <button id="btn">눌러 보세요 🎉</button>
    <div id="count">아직 아무도 누르지 않았어요</div>
  </main>
  <script>
    const timeEl = document.getElementById("time");
    function tick() {
      timeEl.textContent = new Date().toLocaleTimeString("ko-KR", { hour12: false });
    }
    tick();
    setInterval(tick, 1000);

    let clicks = 0;
    document.getElementById("btn").addEventListener("click", () => {
      clicks++;
      document.getElementById("count").textContent = clicks + "번 눌렀어요!";
    });
  </script>
</body>
</html>
